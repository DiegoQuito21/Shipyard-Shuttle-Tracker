<!DOCTYPE html>
<html>
<head>
  <title>Shuttle Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    #status-panel {
      position: absolute; top: 16px; right: 16px; z-index: 1000;
      background: white; padding: 12px 16px; border-radius: 10px;
      font-family: -apple-system, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      border-left: 6px solid #94a3b8;
    }
    #status-panel.on_time { border-left-color: #16a34a; }
    #status-panel.delayed { border-left-color: #dc2626; }
    #status-panel.arrived { border-left-color: #2563eb; }

    #status-text { font-size: 1.1rem; font-weight: 600; }
    #status-panel.on_time #status-text { color: #16a34a; }
    #status-panel.delayed #status-text { color: #dc2626; }
    #status-panel.arrived #status-text { color: #2563eb; }

    #progress-text { font-size: 0.85rem; color: #64748b; margin-top: 2px; }

    #demo-controls {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2e8f0;
      font-size: 0.75rem; color: #64748b; display: flex; gap: 6px; align-items: center;
    }
    #demo-controls button {
      border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px;
      padding: 3px 8px; font-size: 0.75rem; cursor: pointer;
    }
    #demo-controls button:hover { background: #e2e8f0; }

    .bus-icon {
      font-size: 22px; background: white; border: 2px solid #2563eb;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status-panel">
    <div id="status-text">Loading...</div>
    <div id="progress-text"></div>
    <div id="demo-controls">
      <span>Restart demo:</span>
      <button onclick="restartDemo(1)">1x</button>
      <button onclick="restartDemo(5)">5x</button>
      <button onclick="restartDemo(10)">10x</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.7435, -74.026], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    async function drawRoute() {
      const response = await fetch('/api/route');
      const route = await response.json();

      L.polyline(route, { color: '#2563eb', weight: 5, opacity: 0.7 }).addTo(map);
      L.marker(route[0]).addTo(map).bindPopup("Shipyard pickup");
      L.marker(route[route.length - 1]).addTo(map).bindPopup("PATH stop (78 Hudson St)");
      map.fitBounds(route);
    }
    drawRoute();

    const busMarkerIcon = L.divIcon({
      html: '🚌',
      className: 'bus-icon',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
    const busIcon = L.marker([40.751586, -74.024239], { icon: busMarkerIcon }).addTo(map);

    const labels = {
      on_time: "On Time",
      delayed: "Running Late",
      arrived: "Arrived"
    };

    async function updateBusPosition() {
      const response = await fetch('/api/bus-location');
      const data = await response.json();
      busIcon.setLatLng([data.lat, data.lng]);

      const label = labels[data.status] || "Unknown";
      document.getElementById('status-panel').className = data.status;
      document.getElementById('status-text').textContent = label;
      document.getElementById('progress-text').textContent =
        Math.round(data.percent * 100) + "% of trip complete";
    }

    async function restartDemo(speed) {
      await fetch('/api/restart?speed=' + speed, { method: 'POST' });
      updateBusPosition();
    }

    updateBusPosition();
    setInterval(updateBusPosition, 2000);
  </script>
</body>
</html>
