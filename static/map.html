<!DOCTYPE html>
<html>
<head>
  <title>Shuttle Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.7435, -74.026], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const busIcon = L.marker([40.7435, -74.026]).addTo(map);

    async function updateBusPosition() {
      const response = await fetch('/api/bus-location');
      const data = await response.json();
      busIcon.setLatLng([data.lat, data.lng]);
    }

    updateBusPosition();
    setInterval(updateBusPosition, 2000);
  </script>
</body>
</html>
